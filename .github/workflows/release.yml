name: Release

on:
    push:
        tags:
            - 'v*.*.*'

env:
    CARGO_TERM_COLOR: always
    # gh otherwise looks for a local checkout. The create job does not check one out.
    GH_REPO: ${{ github.repository }}

permissions:
    contents: write

jobs:
    create-release:
        name: Create Release
        runs-on: ubuntu-latest
        steps:
            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                    --repo "${{ github.repository }}" \
                    --title "NullScan ${{ github.ref_name }}" \
                    --notes "Release ${{ github.ref_name }} of NullScan." \
                    --verify-tag

    build:
        name: Build
        needs: create-release
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      binary_name: nullscan
                      asset_name: nullscan-linux-x86_64
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-musl
                      binary_name: nullscan
                      asset_name: nullscan-linux-x86_64-musl
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      binary_name: nullscan.exe
                      asset_name: nullscan-windows-x86_64.exe

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install musl tools (Linux musl only)
              if: matrix.target == 'x86_64-unknown-linux-musl'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y musl-tools

            - name: Cache dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build release binary
              run: cargo build --release --target ${{ matrix.target }}

            - name: Strip binary (Unix only)
              if: matrix.os != 'windows-latest'
              run: strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

            - name: Package asset and checksum
              shell: bash
              run: |
                  cd target/${{ matrix.target }}/release
                  cp "${{ matrix.binary_name }}" "${{ matrix.asset_name }}"
                  if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
                    hash=$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 '${{ matrix.asset_name }}').Hash.ToLower()")
                    printf '%s  %s\n' "$hash" "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
                  else
                    shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
                  fi

            - name: Upload release assets
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ github.ref_name }}" \
                    --repo "${{ github.repository }}" \
                    "target/${{ matrix.target }}/release/${{ matrix.asset_name }}" \
                    "target/${{ matrix.target }}/release/${{ matrix.asset_name }}.sha256" \
                    --clobber
